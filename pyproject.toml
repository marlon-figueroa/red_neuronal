[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "red-neuronal"
version = "0.1.0"
description = "Red neuronal (perceptrón multicapa) implementada desde cero con NumPy"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # NumPy 2.0.x (el último para Python 3.9) emite avisos falsos en matmul con Accelerate de macOS.
    "numpy>=1.22,<2; python_version < '3.10'",
    "numpy>=1.22; python_version >= '3.10'",
]

[project.optional-dependencies]
graficos = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.scripts]
red-neuronal = "red_neuronal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # matplotlib 3.9 (el último para Python 3.9) usa APIs de pyparsing marcadas como obsoletas en 3.3.
    "ignore::DeprecationWarning:matplotlib\\..*",
]
